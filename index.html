<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>S91 House Grill · Menú</title>
<meta name="description" content="Menú de S91 House Grill — parrilla hecha al momento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   S91 HOUSE GRILL — MENÚ
   Tipografía de marca: Smile Delight (display) + Montserrat (texto).
   Smile Delight no está en Google Fonts: descomenta el @font-face de
   abajo y sube el archivo de la fuente junto a este HTML.
   ===================================================================== */
/*
@font-face{
  font-family:"Smile Delight";
  src:url("SmileDelight.woff2") format("woff2"), url("SmileDelight.otf") format("opentype");
  font-weight:400; font-display:swap;
}
*/
:root{
  --carbon:#161616;   /* negro de la marca */
  --carbon-2:#1f1b19;
  --crema:#f8f1d5;    /* crema de la marca */
  --crema-2:#e9dfbe;
  --brasa:#7f200e;    /* rojo ladrillo de la marca */
  --vino:#730014;     /* rojo de titulares */
  --cobre:#8a4a22;
  /* Sobre fondo oscuro el rojo ladrillo pierde legibilidad en texto
     pequeño, así que los acentos claros van en crema, no en naranja. */
  --acento:#f8f1d5;
  --ink:#1a1512;
  --ink-soft:#5f524a;
  --display:"Smile Delight","Fraunces",Georgia,serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabs-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--body);
  background:var(--carbon);
  color:var(--crema);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body.intro-on{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--brasa);outline-offset:3px}

/* ---------- Página como carta: columna centrada ---------- */
.page{max-width:720px;margin:0 auto;position:relative}

/* =========================== INTRO =========================== */
#intro{
  position:fixed;inset:0;z-index:50;
  background:var(--carbon);
  display:grid;place-items:center;
  transition:opacity .7s ease;
}
#intro.out{opacity:0;pointer-events:none}
.intro-glow{
  position:absolute;width:90vmin;height:90vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(127,32,14,.55) 0%,rgba(130,35,15,.35) 30%,transparent 65%);
  filter:blur(24px);opacity:0;transform:scale(.3);
}
.play .intro-glow{animation:glow 2.6s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes glow{
  0%{opacity:0;transform:scale(.3)}
  45%{opacity:1}
  100%{opacity:.55;transform:scale(1)}
}
.intro-logo{
  width:min(58vw,250px);aspect-ratio:1190/1450;position:relative;
  will-change:transform;
}
.intro-logo .l{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.intro-logo .flame{color:var(--brasa)}
.intro-logo .mark{color:var(--crema)}
.intro-logo .text{color:var(--crema);transform-origin:50% 62%}

.play .flame{animation:rise 1s cubic-bezier(.2,.8,.2,1) .3s both}
.play .flame use{transform-origin:50% 100%;transform-box:fill-box;animation:flicker 2.2s ease-in-out 1.3s infinite}
.play .mark{animation:spread 1.05s cubic-bezier(.3,.7,.1,1) 1.05s both}
.play .text{animation:arc .75s cubic-bezier(.2,.8,.2,1) 1.8s both}

@keyframes rise{
  from{clip-path:inset(100% 0 0 0);transform:translateY(7%)}
  to{clip-path:inset(-12% 0 0 0);transform:none}
}
@keyframes flicker{
  0%,100%{transform:scaleX(1) scaleY(1)}
  35%{transform:scaleX(.985) scaleY(1.012)}
  70%{transform:scaleX(1.012) scaleY(.99)}
}
@keyframes spread{
  from{clip-path:circle(0% at 44% 48%)}
  to{clip-path:circle(115% at 44% 48%)}
}
@keyframes arc{
  from{opacity:0;transform:rotate(-9deg)}
  to{opacity:1;transform:none}
}

/* =========================== HERO =========================== */
.hero{
  position:relative;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 36px) 24px 40px;
  text-align:center;
  background:
    radial-gradient(60% 40% at 50% 0%,rgba(130,35,15,.35),transparent 70%),
    var(--carbon);
}
.hero-logo{width:132px;margin:0 auto 22px;position:relative;z-index:1}
.hero-logo .full{color:var(--crema)}
.hero-logo .full .fl{color:var(--brasa)}
.hero-copy{position:relative;z-index:1;opacity:0;transform:translateY(14px)}
.ready .hero-copy{animation:copy-in .8s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes copy-in{to{opacity:1;transform:none}}
.tagline{
  font-family:var(--display);
  font-size:clamp(1.55rem,6.4vw,2.2rem);line-height:1.1;
  font-weight:900;font-variation-settings:"SOFT" 100;
  color:var(--crema);
  max-width:15ch;margin:0 auto 18px;
}
.status{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.82rem;font-weight:500;color:var(--crema-2);
  padding:7px 14px;border:1px solid rgba(246,238,212,.22);border-radius:999px;
}
.status i{
  width:8px;height:8px;border-radius:50%;background:var(--crema);
  box-shadow:0 0 0 0 rgba(248,241,213,.5);
  animation:pulse 2.2s ease-out infinite;
}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(127,32,14,0)}}
.hero-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:999px;
  font-weight:600;font-size:.92rem;text-decoration:none;
  transition:transform .2s ease,background .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-fire{background:var(--brasa);color:var(--crema)}
.btn-fire:hover{background:#96290f}
.btn-ghost{border:1px solid rgba(246,238,212,.28);color:var(--crema)}
.btn-ghost:hover{background:rgba(246,238,212,.06)}
.btn svg{width:18px;height:18px}

/* brasas que suben (solo decoración) */
.embers{position:absolute;inset:0;pointer-events:none;z-index:0}
.embers i{
  position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
  background:var(--brasa);opacity:0;
  animation:ember var(--d,7s) linear var(--delay,0s) infinite;
  left:var(--x);
}
@keyframes ember{
  0%{transform:translate(0,0) scale(var(--s,1));opacity:0}
  10%{opacity:.85}
  60%{opacity:.5}
  100%{transform:translate(var(--drift,10px),-420px) scale(.3);opacity:0}
}

/* =========================== TABS =========================== */
.tabs{
  position:sticky;top:0;z-index:20;
  height:var(--tabs-h);
  background:rgba(22,22,22,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(246,238,212,.1);
}
.tabs-track{
  position:relative;height:100%;
  display:flex;gap:4px;padding:0 14px;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  scroll-padding:14px;
}
.tabs-track::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:0 12px;height:100%;
  font-size:.9rem;font-weight:600;letter-spacing:.01em;
  color:rgba(246,238,212,.55);white-space:nowrap;
  transition:color .25s ease;
  position:relative;
}
.tab.active{color:var(--crema)}
.tab-ind{
  position:absolute;bottom:0;left:0;height:3px;width:0;
  background:var(--brasa);border-radius:3px 3px 0 0;
  transition:transform .45s cubic-bezier(.3,.8,.2,1),width .45s cubic-bezier(.3,.8,.2,1);
}
.tab-ind svg{
  position:absolute;right:-2px;bottom:1px;width:11px;height:24px;color:var(--brasa);
  transform-origin:50% 100%;animation:flicker 2.2s ease-in-out infinite;
}

/* =========================== MENÚ (papel) =========================== */
.menu{
  background:var(--crema);color:var(--ink);
  border-radius:26px 26px 0 0;
  padding:8px 0 40px;
  position:relative;
}
.menu::before{ /* borde superior tipo tapa de carta */
  content:"";position:absolute;top:0;left:0;right:0;height:26px;
  background:linear-gradient(var(--crema-2),transparent);opacity:.6;border-radius:26px 26px 0 0;
}

/* Favoritos: fila deslizable */
.favs{padding:22px 0 8px}
.favs h2{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.35rem;color:var(--vino);padding:0 24px;margin-bottom:12px;
}
.favs-track{
  display:flex;gap:12px;padding:0 24px 8px;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
}
.favs-track::-webkit-scrollbar{display:none}
.fav{
  flex:0 0 68%;max-width:280px;scroll-snap-align:start;
  background:var(--carbon-2);color:var(--crema);
  border-radius:18px;padding:18px 18px 16px;
  position:relative;overflow:hidden;
  text-align:left;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.fav:active{transform:scale(.98)}
.fav .fav-flame{
  position:absolute;right:-14px;top:-18px;width:74px;height:170px;
  color:var(--brasa);opacity:.9;transform-origin:50% 100%;
  animation:flicker 2.6s ease-in-out infinite;
}
.fav .fav-name{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.4rem;line-height:1.05;max-width:9ch;margin-bottom:8px;position:relative;
}
.fav .fav-desc{font-size:.8rem;color:rgba(246,238,212,.7);max-width:20ch;margin-bottom:14px;position:relative}
.fav .fav-price{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.6rem;color:var(--crema);position:relative;
}

/* Secciones */
.section{padding:30px 24px 6px;scroll-margin-top:calc(var(--tabs-h) + 8px)}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.section-head h2{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:2rem;line-height:1;color:var(--vino);
}
.section-head .rule{
  flex:1;height:3px;background:var(--brasa);border-radius:2px;
  transform:scaleX(0);transform-origin:left;
  transition:transform .9s cubic-bezier(.2,.8,.2,1) .1s;
}
.section.in .section-head .rule{transform:scaleX(1)}
.section-note{font-size:.85rem;color:var(--ink-soft);margin-bottom:8px}

/* Item = fila clásica de carta con guía de puntos */
.item{
  padding:14px 0;border-bottom:1px solid rgba(26,21,18,.08);
  opacity:0;transform:translateY(8px);
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i,0) * 70ms);
}
.section.in .item{opacity:1;transform:none}
.item-row{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left}
.item-name{font-weight:600;font-size:1.02rem;flex:0 1 auto;color:var(--ink)}
.item-lead{
  flex:1 1 20px;min-width:20px;
  border-bottom:2px dotted rgba(26,21,18,.32);
  transform:scaleX(0);transform-origin:left;
  transition:transform .9s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i,0) * 70ms + 200ms);
  margin-bottom:5px;
}
.section.in .item-lead{transform:scaleX(1)}
.item-price{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.2rem;color:var(--brasa);flex:0 0 auto;
}
.item-desc{font-size:.85rem;color:var(--ink-soft);margin-top:3px;max-width:44ch}
.item-tag{
  display:inline-block;font-size:.68rem;font-weight:700;
  color:var(--crema);background:var(--brasa);
  padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;
}
.item-more{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1);
}
.item-more > div{overflow:hidden}
.item.open .item-more{grid-template-rows:1fr}
.item-more-inner{padding-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item-more-inner .incl{font-size:.82rem;color:var(--ink-soft);flex:1 1 160px}
.btn-sm{padding:9px 14px;font-size:.82rem}

/* ---------- Bebidas: cuadrícula con foto ---------- */
.drinks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
@media(min-width:600px){.drinks{grid-template-columns:repeat(3,1fr)}}
.drink{
  background:#fff;border:1px solid rgba(26,21,18,.09);
  border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 2px 4px rgba(26,21,18,.04), 0 10px 24px -12px rgba(115,0,22,.22);
  opacity:0;transform:translateY(10px);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i,0) * 55ms);
}
.section.in .drink{opacity:1;transform:none}
.drink-shot{
  position:relative;aspect-ratio:1/1;width:100%;
  /* Las fotos van recortadas, sin fondo. Un crema muy suave las asienta
     en la tarjeta en vez de dejarlas como un recorte pegado. */
  background:#faf4e2;
  display:block;overflow:hidden;
}
.drink-shot img{
  width:100%;height:100%;object-fit:contain;padding:6px;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.drink-shot:active img{transform:scale(.97)}
.drink-zoom{
  position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(22,22,22,.55);color:var(--crema);
  display:grid;place-items:center;backdrop-filter:blur(4px);
}
.drink-zoom svg{width:14px;height:14px}
.drink-body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.drink-name{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.12rem;line-height:1.06;color:var(--vino);
}
.drink-desc{font-size:.76rem;color:var(--ink-soft);line-height:1.35}
.drink-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px}
.drink-price{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.34rem;color:var(--brasa);line-height:1;
}

/* ---------- Visor de foto ---------- */
.lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(10,8,7,.92);
  display:grid;place-items:center;padding:26px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:74vh;border-radius:20px;background:#fff}
.lightbox-cap{
  margin-top:16px;text-align:center;color:var(--crema);
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;font-size:1.6rem;
}
.lightbox-cap i{display:block;font-style:normal;font-family:var(--body);font-size:.9rem;font-weight:600;color:var(--crema);opacity:.85;margin-top:2px}
.lightbox-x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:40px;height:40px;border-radius:50%;background:rgba(246,238,212,.14);color:var(--crema);display:grid;place-items:center}
.lightbox-x svg{width:18px;height:18px}

/* Respeta a quien prefiere menos movimiento */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

/* =========================== FOOTER =========================== */
.foot{
  background:var(--carbon);color:var(--crema);
  padding:36px 24px calc(env(safe-area-inset-bottom) + 40px);
  text-align:center;
}
.foot .mark-small{width:64px;margin:0 auto 18px;color:var(--crema)}
.foot .mark-small .fl{color:var(--brasa)}
.foot h3{
  font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;
  font-size:1.5rem;margin-bottom:14px;
}
.foot-grid{display:grid;gap:14px;max-width:360px;margin:0 auto 24px;text-align:left}
.foot-item{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:rgba(246,238,212,.8)}
.foot-item svg{width:20px;height:20px;flex:0 0 auto;color:var(--brasa);margin-top:2px}
.foot-item b{display:block;color:var(--crema);font-weight:600}
.foot-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.foot small{display:block;margin-top:28px;font-size:.72rem;color:rgba(246,238,212,.4)}

/* =========================== Reduced motion =========================== */
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .item,.section-head .rule,.item-lead{opacity:1;transform:none}
  .hero-copy{opacity:1;transform:none}
}
@media (min-width:640px){
  .hero{padding-top:64px}
  .hero-logo{width:150px}
  .fav{flex-basis:44%}
}
</style>
</head>

const hhmm = s => { const [h,m] = s.split(":").map(Number); return h*60 + m; };
const reloj = s => {
  let [h,m] = s.split(":").map(Number);
  const ampm = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return m ? `${h}:${String(m).padStart(2,"0")} ${ampm}` : `${h} ${ampm}`;
};
function estadoHorario(){
  const now = new Date();
  const min = now.getHours()*60 + now.getMinutes();
  const hoy = CONFIG.schedule[now.getDay()];
  if(hoy){
    const [a,b] = hoy.map(hhmm);
    if(min >= a && min < b) return { abierto:true,  txt:`Abierto ahora · hasta las ${reloj(hoy[1])}` };
    if(min < a)             return { abierto:false, txt:`Hoy abrimos a las ${reloj(hoy[0])}` };
  }
  for(let i=1;i<=7;i++){
    const d = (now.getDay()+i) % 7, s = CONFIG.schedule[d];
    if(s) return { abierto:false, txt:`Cerrado · abrimos ${i===1?"mañana":"el "+DIAS[d]} a las ${reloj(s[0])}` };
  }
  return { abierto:false, txt:"Horario por confirmar" };
}
function resumenHorario(){
  const filas = [];
  for(let d=0; d<7; d++){
    const s = CONFIG.schedule[d];
    if(s) filas.push(`${DIAS[d]} ${reloj(s[0])}–${reloj(s[1])}`);
  }
  return filas.length ? filas.join(" · ") : "Por confirmar";
}
(() => {
  const pintar = () => {
    const e = estadoHorario();
    $("#statusText").textContent = e.txt;
    $(".status i").style.background = e.abierto ? "#3ec26a" : "#8a7d72";
  };
  pintar();
  setInterval(pintar, 60000);
})();

/* ---- Favoritos ---- */
(() => {
  const all = MENU.flatMap(c => c.items.map(it => ({...it, cat:c.id})));
  const track = $("#favs");
  CONFIG.favorites.forEach(name => {
    const it = all.find(i => i.name === name); if(!it) return;
    const b = document.createElement("button");
    b.className = "fav"; b.type = "button";
    b.innerHTML = `
      <svg class="fav-flame" viewBox="397 45 315 726" aria-hidden="true"><use href="#s91-flame" fill="currentColor"/></svg>
      <div class="fav-name">${it.name}</div>
      <div class="fav-desc">${it.desc}</div>
      <div class="fav-price">${fmt(it.price)}</div>`;
    b.addEventListener("click", () => {
      const row = document.querySelector(`.item[data-name="${CSS.escape(it.name)}"]`);
      if(row){ row.scrollIntoView({behavior:"smooth", block:"center"}); row.classList.add("open"); }
    });

/* ---- Secciones + tabs ---- */
const tabs = $("#tabs"), ind = $("#tabInd"), sectionsBox = $("#sections");
MENU.forEach(cat => {
  const t = document.createElement("button");
  t.className = "tab"; t.type = "button"; t.textContent = cat.name; t.dataset.target = cat.id;
  t.addEventListener("click", () => {
    $("#"+cat.id).scrollIntoView({behavior:"smooth", block:"start"});
  });
  tabs.appendChild(t);

  const sec = document.createElement("section");
  sec.className = "section"; sec.id = cat.id;
  sec.innerHTML = `
    <div class="section-head"><h2>${cat.name}</h2><span class="rule"></span></div>
    ${cat.note ? `<p class="section-note">${cat.note}</p>` : ""}`;

  /* Categorías con foto (ej. Bebidas): tarjetas en cuadrícula */
  if(cat.grid){
    const grid = document.createElement("div"); grid.className = "drinks";
    cat.items.forEach((it, i) => {
      const card = document.createElement("article");
      card.className = "drink"; card.dataset.name = it.name; card.style.setProperty("--i", i);
      card.innerHTML = `
        <button class="drink-shot" type="button" aria-label="Ver foto de ${it.name}">
          ${it.img ? `<img src="${it.img}" alt="${it.name}">` : ""}
          <span class="drink-zoom" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6M11 8.5v5M8.5 11h5"/></svg>
          </span>
        </button>
        <div class="drink-body">
          <h3 class="drink-name">${it.name}</h3>
          ${it.desc ? `<p class="drink-desc">${it.desc}</p>` : ""}
          <div class="drink-foot">
            <span class="drink-price">${fmt(it.price)}</span>
          </div>
        </div>`;
      $(".drink-shot", card).addEventListener("click", () => abrirFoto(it));
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    sectionsBox.appendChild(sec);
    return;
  }

  cat.items.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "item"; row.dataset.name = it.name; row.style.setProperty("--i", i);
    row.innerHTML = `
      <button type="button" class="item-row" aria-expanded="false">
        <span class="item-name">${it.name}</span>
        <span class="item-lead"></span>
        <span class="item-price">${fmt(it.price)}</span>
      </button>
      ${(it.desc || it.tag) ? `<p class="item-desc">${it.tag ? `<span class="item-tag">${it.tag}</span>` : ""}${it.desc || ""}</p>` : ""}
      <div class="item-more"><div><div class="item-more-inner">
        <span class="incl">${it.incl || "Pregunta por opciones al ordenar."}</span>
      </div></div></div>`;
    const btn = $(".item-row", row);
    btn.addEventListener("click", () => {
      const open = row.classList.toggle("open");
      btn.setAttribute("aria-expanded", open);
    });
    sec.appendChild(row);
  });
  sectionsBox.appendChild(sec);
});

/* indicador de tab */
function moveInd(tab){
  if(!tab) return;
  ind.style.width = tab.offsetWidth + "px";
  ind.style.transform = `translateX(${tab.offsetLeft}px)`;
  tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
  const r = tab.getBoundingClientRect(), tr = tabs.getBoundingClientRect();
  if(r.left < tr.left + 14 || r.right > tr.right - 14) tab.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
}
moveInd(tabs.querySelector(".tab"));

/* scroll-spy */
const secEls = [...document.querySelectorAll(".section")];
const spy = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting) moveInd(tabs.querySelector(`.tab[data-target="${e.target.id}"]`));
  });
}, { rootMargin: "-56px 0px -60% 0px", threshold: 0 });
secEls.forEach(s => spy.observe(s));

/* revelar al hacer scroll (una sola vez por sección) */
const reveal = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); reveal.unobserve(e.target); } });
}, { rootMargin: "0px 0px -12% 0px", threshold: 0.05 });
secEls.forEach(s => reveal.observe(s));

/* compartir */
$("#shareBtn").addEventListener("click", async () => {
  const data = { title:"S91 House Grill · Menú", text:"Mira el menú de S91 House Grill", url: location.href };
  try { if(navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert("Enlace copiado"); } } catch(_){}
});

/* =====================================================================
   VISOR DE FOTO — listo para cuando los platos tengan foto
   ===================================================================== */
const lb = $("#lightbox");
function abrirFoto(it){
  if(!it.img) return;
  $("#lightboxImg").src = it.img;
  $("#lightboxImg").alt = it.name;
  $("#lightboxCap").innerHTML = `${it.name}<i>${fmt(it.price)}</i>`;
  lb.classList.add("show");
  document.body.style.overflow = "hidden";
}
function cerrarFoto(){ lb.classList.remove("show"); document.body.style.overflow = ""; }
lb.addEventListener("click", e => { if(e.target === lb || e.target.closest("#lightboxX")) cerrarFoto(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && lb.classList.contains("show")) cerrarFoto();
});

/* ---- Intro ---- */
(() => {
  const intro = $("#intro"), logo = $("#introLogo"), hero = $("#heroLogo");
  /* La intro se reproduce SIEMPRE al entrar */
  window.scrollTo(0,0);
  intro.classList.add("play");

  setTimeout(() => {
    const a = logo.getBoundingClientRect(), b = hero.getBoundingClientRect();
    const sx = b.width / a.width;
    const dx = (b.left + b.width/2) - (a.left + a.width/2);
    const dy = (b.top + b.height/2) - (a.top + a.height/2);
    logo.style.transition = "transform .95s cubic-bezier(.65,0,.2,1)";
    logo.style.transform = `translate(${dx}px, ${dy}px) scale(${sx})`;
    setTimeout(() => {
      intro.classList.add("out");
      document.body.classList.remove("intro-on");
      document.body.classList.add("ready");
      setTimeout(() => intro.remove(), 800);
    }, 780);
  }, 3000);
})();
</script>
