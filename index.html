<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S91 House Grill — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --vanilla:#F7EFE3;   /* Vanilla Silk */
  --oat:#E7DAC5;       /* Alpine Oat */
  --greige:#A9998A;    /* Warm Greige */
  --wine:#4E1420;      /* Cherry Velvet */
  --noir:#2B0A10;       /* Bordeaux Noir */
  --ink:#2A1B14;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--vanilla);color:var(--ink);font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.55;overflow-x:hidden}
h1,h2,.logo,.cat-title,.brand-tag,.nav-pill{font-family:'Cinzel',serif;text-transform:uppercase}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--noir);display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;animation:introOut .8s ease 2.4s forwards}
.intro-line{width:1px;height:0;background:var(--oat);margin-bottom:22px;animation:lineGrow 1s ease .2s forwards}
.intro-name{font-family:'Cinzel',serif;color:var(--vanilla);font-size:clamp(1.8rem,7vw,3.2rem);
  letter-spacing:.55em;text-indent:.55em;opacity:0;text-align:center;padding:0 20px;
  animation:nameReveal 1.3s ease .5s forwards}
.intro-tag{margin-top:18px;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--greige);
  font-size:.95rem;letter-spacing:.1em;opacity:0;animation:tagFade 1s ease 1.6s forwards}
@keyframes lineGrow{to{height:60px}}
@keyframes nameReveal{0%{opacity:0;letter-spacing:.9em}100%{opacity:1;letter-spacing:.35em}}
@keyframes tagFade{to{opacity:1}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#intro{animation:introOut .3s ease .2s forwards}.intro-name,.intro-tag{opacity:1}.intro-line{height:60px}}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:70px 20px 40px;position:relative}
.hero-name{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:.14em;color:var(--wine);line-height:1;
  opacity:0;transform:translateY(16px);animation:rise .9s ease 2.6s forwards}
.hero-tag{margin-top:14px;font-style:italic;color:var(--greige);font-size:1.05rem;letter-spacing:.05em;
  opacity:0;transform:translateY(12px);animation:rise .9s ease 2.8s forwards}
.hero-rule{width:80px;height:1px;background:var(--wine);margin:26px auto 0;opacity:0;
  animation:fadeIn 1s ease 3.1s forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:.5}}
@media(prefers-reduced-motion:reduce){.hero-name,.hero-tag{opacity:1;transform:none}.hero-rule{opacity:.5}}

/* ---------- NAV PILLS ---------- */
.navbar{position:sticky;top:0;z-index:40;background:rgba(247,239,227,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--greige);padding:12px 0}
.navbar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 18px;max-width:760px;margin:0 auto}
.navbar-inner::-webkit-scrollbar{display:none}
.nav-pill{flex:0 0 auto;font-size:.62rem;letter-spacing:.12em;color:var(--wine);background:var(--oat);
  border:1px solid transparent;padding:8px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:.2s}
.nav-pill:hover{background:var(--wine);color:var(--vanilla)}

.wrap{max-width:720px;margin:0 auto;padding:36px 22px 90px}

/* ---------- SECCIONES ---------- */
.cat-section{margin-bottom:52px;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;scroll-margin-top:80px}
.cat-section.visible{opacity:1;transform:translateY(0)}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.cat-head::before,.cat-head::after{content:'';flex:1;height:1px;background:var(--greige)}
.cat-title{font-size:1.35rem;letter-spacing:.16em;color:var(--wine);white-space:nowrap}

.dish{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 16px;
  border-radius:6px;transition:background .25s}
.dish:hover{background:var(--oat)}
.dish-row{display:flex;flex-direction:column;flex:1}
.dish-name{font-size:1.15rem;font-weight:600;color:var(--ink)}
.dish-desc{font-size:.9rem;color:var(--greige);font-style:italic;margin-top:2px}
.dish-price{font-family:'Cinzel',serif;font-size:.95rem;color:var(--wine);white-space:nowrap;flex-shrink:0;padding-top:2px}

footer{text-align:center;padding:44px 20px;background:var(--noir);color:var(--oat);font-size:.8rem;letter-spacing:.1em}
footer .f-name{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--vanilla);letter-spacing:.2em;margin-bottom:8px}

.wa-float{position:fixed;bottom:22px;right:18px;background:var(--wine);color:var(--vanilla);width:52px;height:52px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(74,18,32,.35);
  text-decoration:none;z-index:50}
.wa-float svg{width:24px;height:24px;fill:currentColor}

.state{text-align:center;padding:80px 20px;color:var(--greige);font-style:italic}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-line"></div>
  <div class="intro-name">S91</div>
  <div class="intro-tag">House Grill</div>
</div>

<section class="hero">
  <h1 class="hero-name" id="brandName">S91 House Grill</h1>
  <p class="hero-tag">Sabor de casa, hecho con fuego</p>
  <div class="hero-rule"></div>
</section>

<nav class="navbar"><div class="navbar-inner" id="navInner"></div></nav>

<main class="wrap" id="menu">
  <div class="state">Cargando menú…</div>
</main>

<footer>
  <div class="f-name">S91 House Grill</div>
  <div>Menú digital</div>
</footer>

<a class="wa-float" id="waFloat" href="#" target="_blank" style="display:none">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
const STORE_ID = 4;
const SB_URL = 'https://drkcstmcdscklcrefxbs.supabase.co';
const SB_KEY = 'sb_publishable_k4jAuf7UCzpT_kp2jSpW-A_1ICXHA2s';
const sb = supabase.createClient(SB_URL, SB_KEY);

function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'); }

async function load(){
  try{
    const [rs, rc, rp] = await Promise.all([
      sb.from('stores').select('*').eq('id', STORE_ID).single(),
      sb.from('categories').select('*').eq('store_id', STORE_ID).order('position'),
      sb.from('products').select('*').eq('store_id', STORE_ID).eq('hidden', false).order('position')
    ]);
    if (rs.error) throw rs.error;
    const store = rs.data;
    const categories = rc.data || [];
    const products = rp.data || [];

    document.title = store.name + ' — Menú';
    document.getElementById('brandName').textContent = store.name;
    if (store.whatsapp){
      const wa = document.getElementById('waFloat');
      wa.href = 'https://wa.me/' + store.whatsapp;
      wa.style.display = 'flex';
    }

    const used = categories.filter(cat => products.some(p => p.category_id === cat.id));

    document.getElementById('navInner').innerHTML = used.map(c =>
      `<a class="nav-pill" href="#sec-${slug(c.name)}">${c.name}</a>`
    ).join('');

    let html = '';
    used.forEach(cat => {
      const items = products.filter(p => p.category_id === cat.id);
      html += `<section class="cat-section" id="sec-${slug(cat.name)}">
        <div class="cat-head"><span class="cat-title">${cat.name}</span></div>`;
      items.forEach(p => {
        const price = p.price ? `<span class="dish-price">$${p.price}</span>` : '';
        html += `<div class="dish">
          <div class="dish-row">
            <span class="dish-name">${p.name}</span>
            ${p.description_es ? `<span class="dish-desc">${p.description_es}</span>` : ''}
          </div>
          ${price}
        </div>`;
      });
      html += `</section>`;
    });
    document.getElementById('menu').innerHTML = html || '<div class="state">El menú se está preparando.</div>';

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, {threshold:.12});
    document.querySelectorAll('.cat-section').forEach(el => obs.observe(el));

  }catch(e){
    console.error(e);
    document.getElementById('menu').innerHTML = '<div class="state">No se pudo cargar el menú.</div>';
  }
}
load();

</script>
</body>
</html>
